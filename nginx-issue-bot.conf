# /etc/nginx/sites-available/issue-bot
# Reverse proxy for the issue-bot FastAPI service
# Adjust server_name to your domain or use a path-based route

server {
    listen 443 ssl;
    server_name mm.guidedgrowthapp.com;  # reuse your MM domain, or use a separate one

    # If you already have an nginx config for Mattermost,
    # just add this location block to that existing server block instead.

    location /bot/ {
        proxy_pass http://127.0.0.1:8321/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
